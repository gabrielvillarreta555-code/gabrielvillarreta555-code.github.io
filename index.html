<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blue Lab Studios</title>
<meta name="description" content="Blue Lab Studios, estudio de Gabriel Villarreta, creador de Despierta.">
<style>
:root{--bg:#0f1024;--bg2:#1b1840;--text:#f1eefb;--soft:#bdb6d8;--line:rgba(255,255,255,.12);--accent:#9fb8ff;--card:rgba(255,255,255,.05)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--text);font:17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:radial-gradient(120% 60% at 50% 0%,#2a2470 0%,var(--bg2) 45%,var(--bg) 100%) fixed;background-color:var(--bg)}
main{max-width:44rem;margin:0 auto;padding:3.5rem 1.25rem 3rem}
.brand{font-weight:700;letter-spacing:.02em;font-size:1rem;color:var(--soft);margin:0 0 3rem}
h1{font-size:2.1rem;line-height:1.2;margin:0}
.role{color:var(--soft);margin:.4rem 0 1.4rem;font-size:1.05rem}
.btn{display:inline-flex;align-items:center;gap:.5rem;min-height:44px;padding:.6rem 1.1rem;border-radius:999px;border:1px solid var(--line);color:var(--text);text-decoration:none;background:var(--card)}
.btn:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
h2{font-size:1.1rem;color:var(--soft);font-weight:600;margin:3rem 0 1rem}
.app{display:block;padding:1.2rem 1.25rem;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--text);text-decoration:none}
.app strong{display:block;font-size:1.2rem}
.app span{color:var(--soft)}
footer{margin-top:3.5rem;color:var(--soft);font-size:.9rem;border-top:1px solid var(--line);padding-top:1rem}
footer a{color:var(--accent)}
</style>
</head>
<body>
<main>
<p class="brand">Blue Lab Studios</p>

<h1>Gabriel Villarreta</h1>
<p class="role">Creador de Despierta | Blue Lab Studios</p>
<!-- El botón de LinkedIn se activa al poner la dirección exacta en href y quitar el atributo hidden. -->
<a class="btn" id="linkedin" href="#" hidden rel="me noopener">LinkedIn</a>

<h2>Aplicaciones</h2>
<a class="app" href="despierta/">
<strong>Despierta</strong>
<span>Alarmas para turnos rotativos, para Android.</span>
</a>

<footer>
<p><a href="despierta/privacidad/">Política de privacidad de Despierta</a></p>
<p>Alojado en GitHub Pages. Este sitio no usa cookies, analítica ni recursos de terceros.</p>
</footer>
</main>
</body>
</html>
